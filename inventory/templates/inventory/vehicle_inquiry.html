<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inquiry | Bilal Automarts</title>
    <link rel="stylesheet" href="{% static 'css/vehicle_inquiry.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Bilal Automarts</div>
        <ul class="nav-links">
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'vehicles' %}">Vehicles <i class="fa fa-caret-down"></i></a></li>
            <li><a href="#">Shop</a></li>
            <li><a href="#">Support & Service</a></li>
        </ul>
        <div class="icons">
            <a href="#"><i class="fa fa-search"></i></a>
            <a href="#"><i class="fa fa-user"></i></a>
        </div>
    </nav>

    <div class="inquiry-container">
        <h2>Send Inquiry for {{ vehicle.title }}</h2>
        <form method="post" class="inquiry-form">
            {% csrf_token %}
            {{ form.as_p }} 
            <button type="submit" class="submit-button">Send Inquiry</button>
        </form>
    </div>

    <script src="{% static 'js/all_vehicles.js' %}"></script>
</body>
</html>
